version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(filename)s -%(name)s -%(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout

  info_file_handler:
    # 关键修改：改为 TimedRotatingFileHandler
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: simple
    filename: log/info.log
    when: D         # 间隔单位：D (天), H (小时), M (分钟), S (秒), W0-W6 (周几)
    interval: 1     # 每 1 天归档一次
    backupCount: 30 # 保留最近 30 天的日志
    encoding: utf8
    atTime: 00:00:00 # 在午夜 0 点进行翻转归档

  debug_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: simple
    filename: log/debug.log
    when: D
    interval: 1
    backupCount: 30
    encoding: utf8
    atTime: 00:00:00

loggers:
  trivago_logic:
    level: INFO
    handlers: [console, info_file_handler]
    propagate: False

  # 关键添加：显式配置 WDM logger
  WDM:
    level: DEBUG
    handlers: [console, debug_file_handler] # 同时输出到控制台和 debug.log
    propagate: False

root:
  level: INFO
  handlers: [console, info_file_handler]